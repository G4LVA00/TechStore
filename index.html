<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore — Cadastro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-header">
            <div class="logo">🛒</div>
            <h1>TechStore Cadastro</h1>
            <p>Cadastre-se e receba ofertas exclusivas de tecnologia!</p>
        </div>

        <form id="formCadastro">
            <div class="campo-grupo">
                <label for="nome">Nome Completo <span class="obrigatorio">*</span></label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Maria da Silva" required>
            </div>

            <div class="campo-grupo">
                <label for="email">E-mail <span class="obrigatorio">*</span></label>
                <input type="email" id="email" name="email" placeholder="Ex: maria@email.com" required>
            </div>

            <div class="campo-grupo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="Ex: (11) 99999-9999">
            </div>

            <button type="submit" class="btn-enviar" id="btnEnviar">Cadastrar</button>

            <div id="mensagem" class="mensagem"></div>
        </form>

        <div class="rodape">
            🛒 TechStore &copy; 2026 — Aula de Front-End Web
        </div>
    </div>

    <!-- SDK do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
